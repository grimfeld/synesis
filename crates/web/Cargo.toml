[package]
name = "web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The browser test build: the engine compiled to wasm32-wasip1, run in the page
# on an in-memory copy of the demo vault (`src/lib/webengine.ts`). Built by
# `scripts/build-web.sh`; never part of the desktop or mobile app.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
