# ship.yml version: 2
# Installed by /ship:setup-ship. The rules it enforces are in docs/agents/shipping.md.
#
# A PR reaches main only once a person has reviewed it and added the `ship` label.
# The label approves; it doesn't land anything by itself. Landing starts from /ship:land (a dispatch),
# the landing schedule (command mode), or a merge whose stacked children it queues.
# - `gate` sets the required `ship` commit status: pending until labelled, success after.
# - `queue` moves a merged PR's stacked children onto main, then takes a labelled PR that
#   conflicts with main out of the queue: `ship` off, `conflicts` on.
# - `land` lands the labelled, green PRs that target main.
# - `dependabot` labels and lands low-risk dependency PRs itself.
#
# SHIP_TOKEN is a fine-grained token (contents, pull requests, workflows: read and write; workflows so the
# stacked-PR cascade can push a merge that brings in workflow changes). Merges, labels,
# pushes and PRs made with the default GITHUB_TOKEN don't trigger other workflows (CI, deploys),
# so every write that must trigger one uses it.
name: Ship

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, closed]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Every gh call reads its repository from here: `land` has no checkout for gh to read it from.
  GH_REPO: ${{ github.repository }}
  SHIP_LABEL: ship
  CONFLICTS_LABEL: conflicts
  MERGE_METHOD: merge

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    # Approval is the label, whatever commits arrive after it: see "What the label approves" in docs/agents/shipping.md.
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Set the ship status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
        run: |
          state=pending; desc="Waiting for review: add the '$SHIP_LABEL' label to ship it"
          if echo "$LABELS" | jq -e --arg l "$SHIP_LABEL" 'index($l) != null' >/dev/null; then
            state=success; desc="Reviewed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=ship -f description="$desc" >/dev/null
          echo "ship: $state ($desc)"
          # `land` turned on auto-merge; without `ship` it goes off, so adding the label back doesn't land the PR by itself.
          if [ "$ACTION" = unlabeled ] && [ "$state" = pending ] && [ "$AUTO_MERGE" = true ]; then
            gh pr merge "$PR" --disable-auto --repo "$GITHUB_REPOSITORY" || echo "::warning::Couldn't turn auto-merge off."
          fi

  dependabot:
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Reads Dependabot's commit metadata itself rather than through dependabot/fetch-metadata,
      # so repos whose Actions policy allows only their own and GitHub's actions can run it.
      - name: Ship patch and GitHub Actions updates without review
        env:
          GH_TOKEN: ${{ secrets.SHIP_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            dependabot/github_actions/*) ;;
            *)
              # One `update-type:` line per dependency; a grouped PR ships only if all are patches.
              types=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '.[0].commit.message' | sed -n 's/^[ -]*update-type: *//p')
              if [ -z "$types" ] || echo "$types" | grep -qv '^version-update:semver-patch$'; then
                echo "Needs review: $(echo "$types" | sort -u | paste -sd, -)"; exit 0
              fi ;;
          esac
          [ -n "$GH_TOKEN" ] || { echo "::warning::Add SHIP_TOKEN as a Dependabot secret too; skipping the label."; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=$SHIP_LABEL" >/dev/null
          # The label alone lands nothing: these PRs need no review, so they land here, not through /ship:land.
          gh pr merge "$PR" --auto "--$MERGE_METHOD" --repo "$GITHUB_REPOSITORY"

  queue:
    # Each time main moves, before each landing run, and when a PR merges (its stacked children).
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged)
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.cascade.outputs.moved }}
    # Pushes queue behind each other; a dispatch or a merge never waits behind them, or a newer push could cancel it.
    concurrency: { group: "ship-queue-${{ github.event_name == 'push' && 'push' || github.run_id }}", cancel-in-progress: false }
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, token: "${{ secrets.SHIP_TOKEN || github.token }}" }
      - name: Move the merged PR's stacked children onto main
        id: cascade
        # A PR merged into main from this repository: a fork's branch has no children here, and a
        # child merged into its parent's branch by hand leaves its own children where they are.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          # SHIP_TOKEN, so the push starts CI on each child and `gate` sees it.
          GH_TOKEN: ${{ secrets.SHIP_TOKEN || github.token }}
          HAS_SHIP_TOKEN: ${{ secrets.SHIP_TOKEN != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGED: ${{ github.event.pull_request.number }}
          MERGED_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" "+refs/pull/$MERGED/head:refs/remotes/pr/$MERGED"
          # A child is a PR based on the merged PR's branch. When that branch is deleted on merge, GitHub
          # retargets the children itself, so also take PRs on main whose last base change came
          # from the merged branch, or that carry the merged PR's head, and don't have the merge yet.
          # Grandchildren stay on their own parent's branch.
          children=$(gh pr list --state open --base "$MERGED_REF" --limit 200 --json number --jq '.[].number')
          # shellcheck disable=SC2016 # GraphQL variables, not shell
          retargeted=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f base="$DEFAULT_BRANCH" -f query='
            query($owner: String!, $name: String!, $base: String!) { repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, baseRefName: $base, first: 100) { nodes { number
                timelineItems(itemTypes: [BASE_REF_CHANGED_EVENT], last: 1) { nodes { ... on BaseRefChangedEvent { previousRefName } } } } } } }' \
            --jq '.data.repository.pullRequests.nodes[] | select(.timelineItems.nodes[0].previousRefName == env.MERGED_REF) | .number' ||
            echo "::warning::Couldn't read base changes; finding children by their commits only." >&2)
          for n in $(gh pr list --state open --base "$DEFAULT_BRANCH" --limit 200 --json number --jq '.[].number'); do
            git fetch -q origin "+refs/pull/$n/head:refs/remotes/pr/$n" || { echo "::warning::#$n: couldn't fetch it."; continue; }
            git merge-base --is-ancestor "$MERGE_SHA" "refs/remotes/pr/$n" && continue
            # Its commits alone miss a child whose parent moved after it branched (the parent's own cascade merge).
            echo " $retargeted " | tr '\n' ' ' | grep -q " $n " || git merge-base --is-ancestor "$MERGED_SHA" "refs/remotes/pr/$n" || continue
            children="$children $n"
          done
          [ -n "${children// /}" ] || { echo "#$MERGED has no stacked children."; exit 0; }
          moved=""
          # Each child on its own: one that fails is reported and skipped, and the others still move.
          for n in $children; do
            pr=$(gh pr view "$n" --json baseRefName,headRefName,isCrossRepository) || { echo "::warning::#$n: couldn't read it."; continue; }
            [ "$(echo "$pr" | jq -r .isCrossRepository)" = false ] || { echo "::warning::#$n is from a fork; retarget it by hand."; continue; }
            if [ "$(echo "$pr" | jq -r .baseRefName)" != "$DEFAULT_BRANCH" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$n" -f base="$DEFAULT_BRANCH" >/dev/null ||
                { echo "::warning::#$n: couldn't retarget it to $DEFAULT_BRANCH."; continue; }
            fi
            # Without SHIP_TOKEN the push would start neither CI nor `gate`, so the child isn't landed this run.
            [ "$HAS_SHIP_TOKEN" = true ] || { echo "::warning::No SHIP_TOKEN secret: merge $DEFAULT_BRANCH into #$n by hand."; continue; }
            { git fetch -q origin "+refs/pull/$n/head:refs/remotes/pr/$n" && git checkout -q --detach "refs/remotes/pr/$n"; } ||
              { echo "::warning::#$n: couldn't check it out; merge $DEFAULT_BRANCH into it by hand."; continue; }
            # A merge, never a rebase: the reviewed commits stay as they are and the push needs no force.
            if git merge -q --no-edit -m "Merge $DEFAULT_BRANCH into #$n after #$MERGED landed" "origin/$DEFAULT_BRANCH"; then
              # Fails if the merge brings in workflow files and SHIP_TOKEN lacks the Workflows permission.
              if git push -q origin "HEAD:refs/heads/$(echo "$pr" | jq -r .headRefName)"; then
                moved="$moved $n"
                echo "#$n: now on $DEFAULT_BRANCH, updated."
              else
                echo "::warning::#$n: now on $DEFAULT_BRANCH, but the push failed; merge $DEFAULT_BRANCH into it by hand."
              fi
            else
              # Left as it is: the next step takes it out of the queue if it carries `ship`.
              git merge --abort || git reset -q --hard
              echo "#$n: now on $DEFAULT_BRANCH, conflicts with it."
            fi
          done
          # Auto-merge waits for the children's new CI. In command mode they land with the next scheduled run,
          # once their CI is green, so a merge starts no landing run there.
          echo "moved=${moved# }" >> "$GITHUB_OUTPUT"
      - name: Take conflicting PRs out of the queue
        env:
          # SHIP_TOKEN, so removing `ship` re-runs `gate` and the status goes back to pending.
          GH_TOKEN: ${{ secrets.SHIP_TOKEN || github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Only PRs on main: a stacked child is checked once its parent lands.
          # Dependabot rebases its own PRs; landing batches are rebuilt by the landing command.
          # shellcheck disable=SC2016 # a jq program, not shell
          prs=$(gh pr list --label "$SHIP_LABEL" --state open --base "$DEFAULT_BRANCH" --limit 200 --json number,isDraft,headRefName --jq '
            [.[] | select(.isDraft | not) | select(.headRefName | startswith("dependabot/") | not)
                 | select(env.LAND_BRANCH_PREFIX == null or env.LAND_BRANCH_PREFIX == "" or (.headRefName | startswith(env.LAND_BRANCH_PREFIX) | not))
                 | .number] | map(tostring) | join(" ")')
          git fetch -q origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          for n in $prs; do
            # GitHub computes `mergeable` lazily after a push or a retarget: null until it has.
            m=null
            for _ in 1 2 3 4 5 6; do
              m=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq '.mergeable')
              [ "$m" != null ] && break
              sleep 10
            done
            echo "#$n: mergeable=$m"
            [ "$m" = false ] || continue
            # Another run may have taken it out already.
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/labels" --jq '.[].name' | grep -qx "$SHIP_LABEL" || continue
            git fetch -q origin "+refs/pull/$n/head:refs/remotes/pr/$n"
            # shellcheck disable=SC2016 # Markdown backticks, not shell
            files=$(git merge-tree --write-tree --name-only "refs/remotes/origin/$DEFAULT_BRANCH" "refs/remotes/pr/$n" | sed -n '2,/^$/p' | sed '/^$/d;s/.*/- `&`/' || true)
            # A queue run for the same merge (its push and its `closed` event) can race this one: whichever removes
            # the label first labels and comments, the other moves on.
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$n/labels/$SHIP_LABEL" >/dev/null 2>&1 || continue
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/labels" -f "labels[]=$CONFLICTS_LABEL" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="$(cat <<EOF
          This PR conflicts with \`$DEFAULT_BRANCH\`, so it has left the landing queue: \`$SHIP_LABEL\` is off and \`$CONFLICTS_LABEL\` is on.

          Conflicting files:
          ${files:-- (listed in the conflicts view on GitHub)}

          To resolve it, run \`/ship:resolve-conflicts $n\`, or merge \`$DEFAULT_BRANCH\` into this branch yourself. Then remove \`$CONFLICTS_LABEL\` and add \`$SHIP_LABEL\` again once the result is reviewed.
          EOF
          )" >/dev/null
          done

  land:
    # /ship:land's dispatch and the landing schedule land every approved PR. A merge lands only the stacked
    # children it just moved. Never a push or a label: approving a PR doesn't land it.
    needs: queue
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.queue.outputs.moved != '')
    runs-on: ubuntu-latest
    concurrency: { group: ship-land, cancel-in-progress: false }
    steps:
      - name: Land the reviewed PRs that target main
        env:
          GH_TOKEN: ${{ secrets.SHIP_TOKEN || github.token }}
          HAS_SHIP_TOKEN: ${{ secrets.SHIP_TOKEN != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ONLY: ${{ needs.queue.outputs.moved }}
          EVENT: ${{ github.event_name }}
        run: |
          [ "$HAS_SHIP_TOKEN" = true ] || echo "::warning::No SHIP_TOKEN secret: merges won't trigger workflows on $DEFAULT_BRANCH (deploys)."
          # A `ship` PR based on another PR's branch is a stacked child: `queue` moves it here once its parent lands.
          # shellcheck disable=SC2016 # a jq program, not shell
          prs=$(gh pr list --label "$SHIP_LABEL" --state open --base "$DEFAULT_BRANCH" --limit 200 --json number,isDraft --jq '
            [.[] | select(.isDraft | not) | .number | tostring
                 | select(env.EVENT != "pull_request" or ((" " + env.ONLY + " ") | contains(" " + . + " ")))] | join(" ")')
          [ -n "$prs" ] || { echo "Nothing to land."; exit 0; }
          for n in $prs; do
            # GitHub merges it once the required checks pass. Auto-merge can't be turned on for a PR that is
            # already mergeable, so that one merges now; never a PR GitHub reports as blocked.
            gh pr merge "$n" --auto "--$MERGE_METHOD" --repo "$GITHUB_REPOSITORY" && continue
            if [ "$(gh pr view "$n" --json mergeStateStatus --jq .mergeStateStatus)" = CLEAN ]; then
              gh pr merge "$n" "--$MERGE_METHOD" --repo "$GITHUB_REPOSITORY" || echo "::warning::#$n: couldn't merge it."
            else
              echo "::warning::#$n: couldn't turn on auto-merge."
            fi
          done
