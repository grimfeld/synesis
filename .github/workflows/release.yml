# Builds installers for every platform and attaches them to a GitHub Release
# named `vX.Y.Z`. Started by hand with `npm run release -- X.Y.Z` (which bumps
# the version files, pushes, and runs `gh workflow run release.yml`), or from
# the Actions tab.
#
# It is a workflow_dispatch from `main` rather than a tag push on purpose.
# GitHub scopes the Actions cache to the ref a run started from plus the
# default branch, so a run on a freshly pushed tag can neither restore the
# `target/` directory a previous release saved nor save one that any later
# release could read. Every release then rebuilt all ~750 crates from scratch
# on every platform (12-19 minutes per job). Run from `main`, each job
# restores the previous release's cache and only compiles what changed.
#
# The `version` job checks that the files carry the requested version, waits
# for CI (ci.yml) to pass on the commit, tags it (a push made with
# GITHUB_TOKEN starts no other workflow) and creates the release as a draft;
# the build jobs only attach files to it, and the `publish` job makes it
# public once every platform is there. If a platform fails, the release stays
# a draft: re-run the failed jobs and `publish` follows. A re-run finds
# the tag and the release already there and leaves both alone. Creating the
# release up front also sidesteps tauri-action creating it with
# `target_commitish`, which GitHub refuses ("Resource not accessible by
# integration") when the default branch has since moved past that commit
# with a change under .github/workflows/.
#
# Auto-updater: the desktop builds also produce updater bundles signed with
# TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD), and tauri-action uploads a
# `latest.json` to the release, each matrix job merging its own platform into
# the one already attached. Installed apps read it from
# https://github.com/grimfeld/synesis/releases/latest/download/latest.json,
# which GitHub serves from the newest release that is neither a draft nor a
# prerelease, so a `X.Y.Z-pre` version never reaches them. Without the key the
# run stops before tagging (.github/actions/require-updater-key).
#
# Supply chain: every third-party action is pinned to a full commit SHA (the
# version in a comment; Dependabot proposes bumps), since one of these jobs
# holds the key every installed app trusts. Only the `version` checkout keeps
# its git credentials, and no secret is passed on a command line.
#
#   macOS   .dmg / .app  (Apple Silicon and Intel)
#   Windows .msi / .exe, signed through SignPath Foundation when SIGNPATH_API_TOKEN
#           (secret) and SIGNPATH_ORGANIZATION_ID (variable) are set
#           (docs/release/signpath.md); unsigned, with a warning, until then.
#   Linux   .AppImage / .deb / .rpm
#   Android .apk, signed with the ANDROID_* secrets. Android cannot install an
#           unsigned package, so the job fails rather than publish one.
#   iOS     .ipa, only when the App Store Connect key (APPLE_API_KEY,
#           APPLE_API_ISSUER, APPLE_API_KEY_P8) and APPLE_TEAM_ID are all set;
#           without them the job is skipped, not failed. Xcode then signs in
#           the cloud, which needs a key with the Admin role. APPLE_CERTIFICATE
#           is the desktop "Developer ID Application" identity and cannot sign
#           iOS apps; to sign with your own "Apple Distribution" certificate
#           instead, set IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and
#           IOS_MOBILE_PROVISION (see https://v2.tauri.app/distribute/sign/ios/).
#           The IPA is also uploaded to App Store Connect, for TestFlight.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v; package.json, tauri.conf.json and Cargo.toml must already say it"
        required: true
        type: string

# Read-only by default; each job that writes to the release asks for
# `contents: write` itself.
permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  version:
    name: Version, tag and release
    runs-on: ubuntu-22.04
    # Waiting for CI takes most of this job; the rest is seconds.
    timeout-minutes: 90
    permissions:
      contents: write # push the tag, create the draft release
      actions: read # read CI's runs on this commit
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      has_apple_cert: ${{ steps.secrets.outputs.has_apple_cert }}
      has_ios_key: ${{ steps.secrets.outputs.has_ios_key }}
      has_android_key: ${{ steps.secrets.outputs.has_android_key }}
    steps:
      # The one checkout that keeps its credentials: it pushes the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the requested version with package.json, package-lock.json, tauri.conf.json and Cargo.toml
        run: |
          case "$VERSION" in
            v*) echo "::error::Give the version without the v: ${VERSION#v}"; exit 1 ;;
          esac
          node scripts/release.mjs --check "$VERSION"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            case "$VERSION" in
              *-*) echo "::warning::Releasing the prerelease $VERSION from $GITHUB_REF_NAME rather than main." ;;
              *) echo "::error::A release comes from main; $GITHUB_REF_NAME may only release a X.Y.Z-pre version."; exit 1 ;;
            esac
          fi

      # Nothing ships that failed CI. `npm run release` pushes the commit and
      # starts this run at once, so CI (ci.yml) is usually still running: wait
      # for it rather than run the same tests a second time here.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 75 * 60 ))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
              echo "CI passed on ${GITHUB_SHA:0:7}."
              break
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<< "$runs" > /dev/null; then
              echo "::error::CI did not pass on ${GITHUB_SHA:0:7} ($(jq -r 'map(.conclusion) | join(", ")' <<< "$runs")). Fix it, or re-run CI if it was cancelled, then start the release again."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No finished CI run on ${GITHUB_SHA:0:7} after 75 minutes; start the release again once CI has passed."
              exit 1
            fi
            echo "Waiting for CI on ${GITHUB_SHA:0:7}: $(jq -c . <<< "$runs")"
            sleep 30
          done

      # Checked before the tag and the release exist, so a missing key leaves
      # nothing half-published behind.
      - uses: ./.github/actions/require-updater-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # The tag is created here rather than pushed from the developer's machine
      # (see the note at the top). A re-run finds it already in place; a tag
      # that exists but points elsewhere means the version was reused, which
      # is an error rather than something to silently move.
      - name: Tag the commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            tagged=$(git rev-parse "$TAG^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists and points at ${tagged:0:7}, not at this commit (${GITHUB_SHA:0:7}). Bump the version rather than reuse it."
              exit 1
            fi
            echo "$TAG already points at this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Synesis $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Create the release before any build starts (see the note at the top),
      # as a draft: installed apps and the landing page read the latest
      # published release, and must not see this one until the `publish` job
      # has checked every platform is attached. A re-run finds the release
      # already there and leaves it alone. Its id goes to the build jobs,
      # since a draft cannot be looked up by its tag. A new release's id is
      # taken from the create response: the list behind `find_id` can lag
      # behind a just-created draft, so it only answers "does it exist yet?".
      - name: Create the GitHub Release (draft)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1
          }
          id=$(find_id)
          if [ -n "$id" ]; then
            echo "Release $TAG already exists."
          else
            # The previous step pushed the tag; refuse to let the API create
            # one from the default branch if it is somehow missing.
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent \
              || { echo "::error::Tag $TAG does not exist on GitHub."; exit 1; }
            prerelease=false
            case "$VERSION" in *-*) prerelease=true ;; esac
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="Synesis $TAG" \
              -f body="Installers for macOS, Windows, Linux and Android. See the assets below." \
              -F draft=true \
              -F prerelease="$prerelease" \
              --jq .id)
          fi
          [ -n "$id" ] || { echo "::error::Could not find the release for $TAG."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Which signing material is available. The macOS and iOS answers are
      # separate: APPLE_CERTIFICATE is a "Developer ID Application" identity,
      # which signs the desktop builds and nothing else. An iOS build is signed
      # by Xcode through the App Store Connect key, so the iOS job waits for
      # the complete key (id, issuer, private key) plus the team id.
      - id: secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "has_apple_cert=$([ -n "$APPLE_CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_ios_key=$([ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_android_key=$([ -n "$ANDROID_KEYSTORE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            cache: macos-arm64
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            cache: macos-x64
          # Windows has its own job below: SignPath signs only files handed
          # over as workflow artifacts, so the build is split around it.
          - name: Linux
            os: ubuntu-22.04
            args: ""
            cache: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No desktop build without the updater signing key (see the note at the top).
      - uses: ./.github/actions/require-updater-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # `key` keeps the two macOS entries apart: they run on the same runner
      # image and would otherwise compute the same cache key, so only one of
      # them could ever save, and the other would restore a target/ built for
      # the wrong architecture. `cache-on-failure` keeps the dependency build
      # from a failed run, so the fix-up run after it is not cold again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: ${{ matrix.cache }}
          cache-on-failure: true

      # Cypress ships a browser binary that `npm ci` downloads from its own
      # CDN. A release build runs no tests and never uses it, and on 2026-09-17
      # that download failed and took the Android build with it.
      - run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      # Optional code signing; builds stay unsigned when the secrets are absent.
      # The bundler signs whenever APPLE_CERTIFICATE exists in the environment,
      # and a workflow `env:` entry for a missing secret still exists — it is
      # just empty — so the variables are exported here instead, only once we
      # know they carry a value. Otherwise `security import` is handed an empty
      # certificate and the macOS jobs fail.
      - name: Export the Apple signing secrets (when they are set)
        if: runner.os == 'macOS' && needs.version.outputs.has_apple_cert == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            # Heredoc form: a base64 certificate may span several lines.
            printf '%s<<APPLE_SECRET_EOF\n%s\nAPPLE_SECRET_EOF\n' \
              "$name" "$value" >> "$GITHUB_ENV"
          done

      # With a Developer ID provisioning profile that carries iCloud, the Mac
      # app gets the iCloud entitlement and can create Synesis's container
      # itself (ADR 0022). Without one it is left out: macOS kills an app
      # that claims iCloud with no profile, and the app then uses the
      # container only once an iPhone has made it. Tauri merges
      # tauri.macos.conf.json into the config on macOS.
      - name: iCloud for the Mac (when MACOS_PROVISION_PROFILE is set)
        if: runner.os == 'macOS' && needs.version.outputs.has_apple_cert == 'true'
        env:
          MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_PROVISION_PROFILE" ]; then
            echo "No MACOS_PROVISION_PROFILE; the Mac app is built without iCloud entitlements."
            exit 0
          fi
          printf "%s" "$MACOS_PROVISION_PROFILE" | tr -d "[:space:]" | base64 -d > src-tauri/embedded.provisionprofile
          if ! security cms -D -i src-tauri/embedded.provisionprofile | grep -q "iCloud.tech.grimfeld.synesis"; then
            echo "::error::MACOS_PROVISION_PROFILE is not a profile carrying the iCloud container iCloud.tech.grimfeld.synesis. Make a Developer ID profile for tech.grimfeld.synesis after enabling iCloud on the App ID, and set it base64-encoded."
            exit 1
          fi
          sed "s/TEAM_ID/$APPLE_TEAM_ID/g" src-tauri/macos/Synesis.entitlements > src-tauri/macos/Synesis.signed.entitlements
          printf '%s\n' '{"bundle":{"macOS":{"entitlements":"macos/Synesis.signed.entitlements","files":{"embedded.provisionprofile":"embedded.provisionprofile"}}}}' > src-tauri/tauri.macos.conf.json

      # The release already exists (created by the `version` job, as a draft),
      # so this only builds and uploads to it by id: a draft cannot be found
      # by its tag. tagName still makes the download URLs in latest.json;
      # releaseName is required by the action but never used to create
      # anything. The TAURI_SIGNING_* pair signs
      # the updater bundles (`bundle.createUpdaterArtifacts`); with
      # includeUpdaterJson the action downloads the release's `latest.json`
      # if there is one, adds this job's platform and uploads it again.
      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.version.outputs.release_id }}
          tagName: ${{ env.TAG }}
          releaseName: "Synesis ${{ env.TAG }}"
          releaseDraft: true
          prerelease: ${{ contains(inputs.version, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android:
    name: Android
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: write # upload to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264"

      # 64-bit ARM only. Every phone sold since about 2017 is arm64, Google
      # Play has required 64-bit since 2019, and each extra target is another
      # full Rust build with LTO (armv7 and x86_64 used to triple this job).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      # Cypress ships a browser binary that `npm ci` downloads from its own
      # CDN. A release build runs no tests and never uses it, and on 2026-09-17
      # that download failed and took the Android build with it.
      - run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Generate the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npm run tauri -- android init --ci

      # `android init` ships Tauri's default icon and an edge-to-edge activity; fix both.
      - name: Adjust the generated Android project (icons, window insets, keyboard)
        run: npm run android:post-init

      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npm run tauri -- android build --apk --target aarch64

      # Without --split-per-abi Tauri builds the "universal" flavor whatever
      # the target list, but the glob does not depend on that.
      - name: Locate the APK
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::No release APK under src-tauri/gen/android/app/build/outputs/apk"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Sign the APK (when ANDROID_* secrets are set)
        if: needs.version.outputs.has_android_key == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The passwords reach apksigner through the environment (env:NAME),
        # never on its command line, where any process could read them.
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KS"' EXIT
          echo "$ANDROID_KEYSTORE" | base64 -d > "$KS"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign --ks "$KS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD --out "$APK" "$RUNNER_TEMP/aligned.apk"

      - name: Rename the APK
        run: |
          mkdir -p out
          cp "$APK" "out/Synesis_${VERSION}_android.apk"

      # Android refuses to install an unsigned package, so publishing one is
      # worse than failing: the release looks complete and nobody can use it.
      - name: Refuse to publish an unsigned APK
        run: |
          APK="out/Synesis_${VERSION}_android.apk"
          if ! "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK"; then
            echo "::error::$APK carries no signature, so no device can install it." \
              "Set ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and" \
              "ANDROID_KEY_PASSWORD, then tag again."
            exit 1
          fi

      # gh finds a draft release by its tag; no third-party action needed.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/*.apk --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    name: iOS
    needs: version
    if: needs.version.outputs.has_ios_key == 'true'
    runs-on: macos-latest
    permissions:
      contents: write # upload to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      # Cypress ships a browser binary that `npm ci` downloads from its own
      # CDN. A release build runs no tests and never uses it, and on 2026-09-17
      # that download failed and took the Android build with it.
      - run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      # Two ways to sign. With only the App Store Connect key, `tauri ios
      # build` imports a placeholder identity and lets Xcode sign in the
      # cloud, which works when the key has the Admin role. With an "Apple
      # Distribution" certificate and an App Store provisioning profile in the
      # IOS_* secrets, Tauri imports those and signs locally instead. Either
      # way Tauri does the keychain work itself; the variables are exported
      # here only when they carry a value, for the same reason as the desktop
      # job above. (APPLE_CERTIFICATE is deliberately not used: it is the
      # macOS "Developer ID Application" identity, which cannot sign iOS.)
      - name: Export the iOS signing secrets (when they are set)
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          for name in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            value="${!name}"
            [ -n "$value" ] || continue
            printf '%s<<IOS_SECRET_EOF\n%s\nIOS_SECRET_EOF\n' \
              "$name" "$value" >> "$GITHUB_ENV"
          done
          if [ -n "$IOS_CERTIFICATE" ]; then
            echo "Signing with the IOS_CERTIFICATE identity."
          else
            echo "No IOS_CERTIFICATE set; Xcode will sign in the cloud with the App Store Connect key."
          fi

      # `tauri ios build` wants a path to the App Store Connect key, and a
      # fresh runner has no such file, so write the key out and hand over
      # where it landed. RUNNER_TEMP is wiped when the job ends.
      - name: Write the App Store Connect key to disk
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # The key id is 10 letters and digits; a stray space or newline in
          # the secret would break the file name Xcode looks for.
          ID="$APPLE_API_KEY"
          if ! printf "%s" "$ID" | grep -Eq "^[A-Z0-9]{10}$"; then
            echo "::error::APPLE_API_KEY must be the 10-character Key ID from App Store Connect → Users and Access → Integrations."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${ID}.p8"
          # Accept the .p8 file as pasted (PEM) or base64-encoded. macOS
          # base64 -d does not reject PEM text, it writes garbage, so tell the
          # two apart before decoding.
          if printf "%s" "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf "%s\n" "$APPLE_API_KEY_P8" | tr -d "\r" > "$KEY"
          else
            printf "%s" "$APPLE_API_KEY_P8" | tr -d "[:space:]" | base64 -d | tr -d "\r" > "$KEY"
          fi
          chmod 600 "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::APPLE_API_KEY_P8 is not a readable .p8 key. Set it to the AuthKey_<id>.p8 file, as is or base64-encoded: gh secret set APPLE_API_KEY_P8 < AuthKey_<id>.p8"
            exit 1
          fi
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Generate the iOS project
        run: npm run tauri -- ios init --ci

      # `ios init` ships Tauri's default icon, an empty entitlements file, and
      # may not link the system frameworks iroh needs. Put our icons in, add
      # the iCloud entitlements (ADR 0022), and check SystemConfiguration and
      # Network are linked (scripts/ios-post-init.mjs).
      - name: Prepare the iOS project (icons, iCloud, frameworks)
        run: npm run ios:post-init

      # xcodebuild's export errors are terse, so the two that come from the
      # Apple account rather than from this repository get a translation.
      - name: Build the IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -o pipefail
          if npm run tauri -- ios build --export-method app-store-connect 2>&1 | tee "$RUNNER_TEMP/ios-build.log"; then
            exit 0
          fi
          if grep -q "Cloud signing permission error" "$RUNNER_TEMP/ios-build.log"; then
            echo "::error::Xcode could not sign in the cloud: the App Store Connect key" \
              "(APPLE_API_KEY) needs the Admin role. Create a new key with Admin access" \
              "under App Store Connect > Users and Access > Integrations, update" \
              "APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_P8, then tag again." \
              "Alternatively sign locally by setting IOS_CERTIFICATE," \
              "IOS_CERTIFICATE_PASSWORD and IOS_MOBILE_PROVISION."
          fi
          if grep -qiE "icloud-container|ubiquity-container|iCloud capability" "$RUNNER_TEMP/ios-build.log"; then
            echo "::error::The provisioning profile does not carry iCloud. In the Apple"               "Developer portal, register the container iCloud.tech.grimfeld.synesis,"               "enable iCloud (CloudKit/iCloud Documents) on the App ID"               "tech.grimfeld.synesis and assign that container to it. Cloud signing"               "then makes a new profile; with IOS_MOBILE_PROVISION, regenerate the"               "profile and update that secret."
          fi
          if grep -q "No profiles for" "$RUNNER_TEMP/ios-build.log"; then
            echo "::error::No App Store provisioning profile exists for the bundle" \
              "identifier. Register it under developer.apple.com > Identifiers so" \
              "Xcode can create one, or provide a profile in IOS_MOBILE_PROVISION."
          fi
          exit 1

      - name: Rename the IPA
        run: |
          mkdir -p out
          cp src-tauri/gen/apple/build/arm64/*.ipa "out/Synesis_${VERSION}_ios.ipa"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/*.ipa --clobber --repo "$GITHUB_REPOSITORY"

      # The IPA is signed for the App Store, so a phone installs it only
      # through TestFlight. altool finds AuthKey_<id>.p8 in
      # API_PRIVATE_KEYS_DIR, the folder the key step wrote it to. App Store
      # Connect refuses a build number it has seen, so a rerun of the same
      # version warns instead of failing the release.
      - name: Upload to TestFlight
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          export API_PRIVATE_KEYS_DIR="$(dirname "$APPLE_API_KEY_PATH")"
          set -o pipefail
          if xcrun altool --upload-app -t ios -f "out/Synesis_${VERSION}_ios.ipa" \
              --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER" 2>&1 | tee "$RUNNER_TEMP/altool.log"; then
            echo "Uploaded; the build appears in TestFlight once Apple has processed it."
            exit 0
          fi
          if grep -qiE "already been uploaded|bundle version must be higher|ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE" "$RUNNER_TEMP/altool.log"; then
            echo "::warning::App Store Connect already has build ${VERSION}; nothing uploaded."
            exit 0
          fi
          exit 1

  # SignPath Foundation signs open-source releases for free, but only files a
  # GitHub workflow built and handed over as an artifact (its proof of
  # origin). So the build is split around it: the app's exe is built and
  # signed first, the installers are bundled around the signed exe, then the
  # installers themselves are signed. Their updater signatures are made last,
  # over the signed bytes, or the updater would reject them.
  windows:
    name: Desktop (Windows)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write # upload to the release
      actions: read # SignPath fetches the artifacts to sign
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'synesis' }}
      SIGNPATH_POLICY: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No desktop build without the updater signing key (see the note at the top).
      - uses: ./.github/actions/require-updater-key
        with:
          private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Until SignPath is set up the installers ship unsigned: Windows warns
      # on them and SmartScreen asks for "More info → Run anyway", but they
      # install and update. The SignPath steps below run only when it is set.
      - name: Is SignPath set up?
        id: signpath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNPATH_API_TOKEN (secret) or SIGNPATH_ORGANIZATION_ID (variable) is not set, so the Windows installers ship unsigned. See docs/release/signpath.md."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          key: windows-x64
          cache-on-failure: true

      - run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Build the app (no installers yet)
        run: npm run tauri -- build --no-bundle

      - name: Hand the exe over for signing
        id: exe
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe-unsigned
          path: target/release/synesis.exe
          if-no-files-found: error

      - name: Sign the exe
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          wait-for-completion: true
          # Each request waits for a person to approve it in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-exe

      - name: Put the signed exe in place
        if: steps.signpath.outputs.enabled == 'true'
        run: cp signed-exe/synesis.exe target/release/synesis.exe

      # Updater artifacts are made below, after signing, so the bundler must
      # not make them from the unsigned installers here.
      - name: Bundle the installers around the signed exe
        run: npm run tauri -- bundle --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Gather the installers
        run: |
          mkdir -p installers
          cp target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi installers/
          ls -l installers

      - name: Hand the installers over for signing
        id: installers
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers-unsigned
          path: installers/
          if-no-files-found: error

      - name: Sign the installers
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: windows-installers
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          wait-for-completion: true
          # Each request waits for a person to approve it in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: out

      - name: Use the unsigned installers
        if: steps.signpath.outputs.enabled != 'true'
        run: mkdir -p out && cp installers/* out/

      # Belt and braces: with SignPath set up, never publish a file it did not sign.
      - name: Check every file carries a valid signature
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = Get-ChildItem out -File | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { $bad | ForEach-Object { Write-Output "::error::$($_.Name) is not validly signed" }; exit 1 }

      - name: Sign the installers for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in out/*-setup.exe out/*.msi; do
            npm run --silent tauri -- signer sign "$f"
          done
          ls -l out

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"

  # tauri-action writes latest.json for the platforms it built; Windows is
  # built above without it, so its entries are added here from the signatures
  # uploaded beside the installers. Runs whatever else failed, so a release
  # whose Windows job succeeded can still update Windows.
  updater-windows:
    name: Add Windows to the updater manifest
    needs: [desktop, windows]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write # update latest.json
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          mkdir work && cd work
          gh release download "$TAG" --repo "$R" --pattern 'latest.json' || \
            jq -n --arg v "$VERSION" '{version: $v, notes: "", pub_date: (now | todate), platforms: {}}' > latest.json
          gh release download "$TAG" --repo "$R" --pattern '*-setup.exe.sig' --pattern '*.msi.sig'
          base="https://github.com/$R/releases/download/$TAG"
          nsis=$(ls *-setup.exe.sig); msi=$(ls *.msi.sig)
          # GitHub turns spaces in asset names into dots; ours have none.
          jq --arg ns "$(cat "$nsis")" --arg nu "$base/${nsis%.sig}" \
             --arg ms "$(cat "$msi")" --arg mu "$base/${msi%.sig}" \
             '.platforms["windows-x86_64"] = {signature: $ns, url: $nu}
              | .platforms["windows-x86_64-nsis"] = {signature: $ns, url: $nu}
              | .platforms["windows-x86_64-msi"] = {signature: $ms, url: $mu}' \
             latest.json > latest.new && mv latest.new latest.json
          # tauri-action merges latest.json job by job; two jobs finishing
          # together can drop each other's entry. The `publish` job refuses
          # such a manifest; say early which entry is missing.
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p]' latest.json > /dev/null || \
              echo "::warning::latest.json has no $p entry; re-run that desktop job, then this one."
          done
          gh release upload "$TAG" latest.json --clobber --repo "$R"

  # Make the draft public, only once every desktop platform and Android is
  # attached and latest.json names all four desktop platforms: published,
  # the release becomes what installed apps update to, and a manifest
  # missing a platform would strand its users on the old version. A failed
  # platform leaves the release a draft; re-run the failed jobs and this one
  # follows. iOS does not hold the release back: it ships through
  # TestFlight, and its job has yet to succeed.
  publish:
    name: Publish the release
    needs: [desktop, windows, updater-windows, android, ios]
    if: >-
      !cancelled() &&
      needs.desktop.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.updater-windows.result == 'success' &&
      needs.android.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write # publish the release
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          mkdir work && cd work
          gh release download "$TAG" --repo "$R" --pattern 'latest.json'
          missing=""
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url and .platforms[$p].signature' latest.json > /dev/null || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "::error::latest.json has no entry for:$missing. The release stays a draft; re-run that desktop job, then 'Add Windows to the updater manifest', then this one."
            exit 1
          fi
          gh release view "$TAG" --repo "$R" --json assets --jq '.assets[].name' > assets.txt
          grep -q '_android\.apk$' assets.txt || { echo "::error::No Android APK on the release; it stays a draft."; exit 1; }
          if [ "$IOS_RESULT" != "success" ] && [ "$IOS_RESULT" != "skipped" ]; then
            echo "::warning::The iOS job ended '$IOS_RESULT'; publishing without the IPA."
          fi
          gh release edit "$TAG" --repo "$R" --draft=false
          echo "Published $TAG."

  # The landing page reads the latest Release when it is built, and opens a
  # platform's download once its file is attached (site/src/lib/release.ts).
  # Rebuild it once the release is published; a draft is invisible to it.
  site:
    name: Rebuild the landing page
    needs: [publish]
    runs-on: ubuntu-22.04
    steps:
      - name: Ask Vercel to rebuild synesis-app.vercel.app
        env:
          HOOK: ${{ secrets.VERCEL_SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_SITE_DEPLOY_HOOK is not set; the page rebuilds on its next push to main."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Rebuild requested."
