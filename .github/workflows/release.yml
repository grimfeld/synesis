# Builds installers for every platform and attaches them to a GitHub Release
# named `vX.Y.Z`. Started by hand with `npm run release -- X.Y.Z` (which bumps
# the version files, pushes, and runs `gh workflow run release.yml`), or from
# the Actions tab.
#
# It is a workflow_dispatch from `main` rather than a tag push on purpose.
# GitHub scopes the Actions cache to the ref a run started from plus the
# default branch, so a run on a freshly pushed tag can neither restore the
# `target/` directory a previous release saved nor save one that any later
# release could read. Every release then rebuilt all ~750 crates from scratch
# on every platform (12-19 minutes per job). Run from `main`, each job
# restores the previous release's cache and only compiles what changed.
#
# The `version` job checks that the files carry the requested version, tags
# the commit (a push made with GITHUB_TOKEN starts no other workflow) and
# creates the release; the build jobs only attach files to it. A re-run finds
# the tag and the release already there and leaves both alone. Creating the
# release up front also sidesteps tauri-action creating it with
# `target_commitish`, which GitHub refuses ("Resource not accessible by
# integration") when the default branch has since moved past that commit
# with a change under .github/workflows/.
#
#   macOS   .dmg / .app  (Apple Silicon and Intel)
#   Windows .msi / .exe
#   Linux   .AppImage / .deb / .rpm
#   Android .apk, signed with the ANDROID_* secrets. Android cannot install an
#           unsigned package, so the job fails rather than publish one.
#   iOS     .ipa, only when the App Store Connect key (APPLE_API_KEY,
#           APPLE_API_ISSUER, APPLE_API_KEY_P8) and APPLE_TEAM_ID are all set;
#           without them the job is skipped, not failed. Xcode then signs in
#           the cloud, which needs a key with the Admin role. APPLE_CERTIFICATE
#           is the desktop "Developer ID Application" identity and cannot sign
#           iOS apps; to sign with your own "Apple Distribution" certificate
#           instead, set IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and
#           IOS_MOBILE_PROVISION (see https://v2.tauri.app/distribute/sign/ios/).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v; package.json, tauri.conf.json and Cargo.toml must already say it"
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  version:
    name: Version, tag and release
    runs-on: ubuntu-22.04
    outputs:
      has_apple_cert: ${{ steps.secrets.outputs.has_apple_cert }}
      has_ios_key: ${{ steps.secrets.outputs.has_ios_key }}
      has_android_key: ${{ steps.secrets.outputs.has_android_key }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare the requested version with package.json, tauri.conf.json and Cargo.toml
        run: |
          case "$VERSION" in
            v*) echo "::error::Give the version without the v: ${VERSION#v}"; exit 1 ;;
          esac
          node scripts/release.mjs --check "$VERSION"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::warning::Releasing from $GITHUB_REF_NAME rather than main."
          fi

      # The tag is created here rather than pushed from the developer's machine
      # (see the note at the top). A re-run finds it already in place; a tag
      # that exists but points elsewhere means the version was reused, which
      # is an error rather than something to silently move.
      - name: Tag the commit
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            tagged=$(git rev-parse "$TAG^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists and points at ${tagged:0:7}, not at this commit (${GITHUB_SHA:0:7}). Bump the version rather than reuse it."
              exit 1
            fi
            echo "$TAG already points at this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Synesis $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Create the release before any build starts (see the note at the top).
      # A re-run finds the release already there and leaves it alone.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag $prerelease \
            --title "Synesis $TAG" \
            --notes "Installers for macOS, Windows, Linux and Android. See the assets below."

      # Which signing material is available. The macOS and iOS answers are
      # separate: APPLE_CERTIFICATE is a "Developer ID Application" identity,
      # which signs the desktop builds and nothing else. An iOS build is signed
      # by Xcode through the App Store Connect key, so the iOS job waits for
      # the complete key (id, issuer, private key) plus the team id.
      - id: secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "has_apple_cert=$([ -n "$APPLE_CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_ios_key=$([ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_android_key=$([ -n "$ANDROID_KEYSTORE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            cache: macos-arm64
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            cache: macos-x64
          - name: Windows
            os: windows-latest
            args: ""
            cache: windows-x64
          - name: Linux
            os: ubuntu-22.04
            args: ""
            cache: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # `key` keeps the two macOS entries apart: they run on the same runner
      # image and would otherwise compute the same cache key, so only one of
      # them could ever save, and the other would restore a target/ built for
      # the wrong architecture. `cache-on-failure` keeps the dependency build
      # from a failed run, so the fix-up run after it is not cold again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.cache }}
          cache-on-failure: true

      # Cypress ships a browser binary that `npm ci` downloads from its own
      # CDN. A release build runs no tests and never uses it, and on 2026-09-17
      # that download failed and took the Android build with it.
      - run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      # Optional code signing; builds stay unsigned when the secrets are absent.
      # The bundler signs whenever APPLE_CERTIFICATE exists in the environment,
      # and a workflow `env:` entry for a missing secret still exists — it is
      # just empty — so the variables are exported here instead, only once we
      # know they carry a value. Otherwise `security import` is handed an empty
      # certificate and the macOS jobs fail.
      - name: Export the Apple signing secrets (when they are set)
        if: runner.os == 'macOS' && needs.version.outputs.has_apple_cert == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            # Heredoc form: a base64 certificate may span several lines.
            printf '%s<<APPLE_SECRET_EOF\n%s\nAPPLE_SECRET_EOF\n' \
              "$name" "$value" >> "$GITHUB_ENV"
          done

      # The release already exists (created by the `version` job), so this
      # only builds and uploads. releaseName is still required by the action
      # but is never used to create anything.
      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: "Synesis ${{ env.TAG }}"
          releaseDraft: false
          prerelease: ${{ contains(inputs.version, '-') }}
          args: ${{ matrix.args }}

  android:
    name: Android
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264"

      # 64-bit ARM only. Every phone sold since about 2017 is arm64, Google
      # Play has required 64-bit since 2019, and each extra target is another
      # full Rust build with LTO (armv7 and x86_64 used to triple this job).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      # Cypress ships a browser binary that `npm ci` downloads from its own
      # CDN. A release build runs no tests and never uses it, and on 2026-09-17
      # that download failed and took the Android build with it.
      - run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Generate the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npm run tauri -- android init --ci

      # `android init` ships Tauri's default icon and an edge-to-edge activity; fix both.
      - name: Adjust the generated Android project (icons, window insets, keyboard)
        run: npm run android:post-init

      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npm run tauri -- android build --apk --target aarch64

      # Without --split-per-abi Tauri builds the "universal" flavor whatever
      # the target list, but the glob does not depend on that.
      - name: Locate the APK
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::No release APK under src-tauri/gen/android/app/build/outputs/apk"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Sign the APK (when ANDROID_* secrets are set)
        if: needs.version.outputs.has_android_key == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/release.keystore
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -p 4 "$APK" /tmp/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$APK" /tmp/aligned.apk

      - name: Rename the APK
        run: |
          mkdir -p out
          cp "$APK" "out/Synesis_${VERSION}_android.apk"

      # Android refuses to install an unsigned package, so publishing one is
      # worse than failing: the release looks complete and nobody can use it.
      - name: Refuse to publish an unsigned APK
        run: |
          APK="out/Synesis_${VERSION}_android.apk"
          if ! "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK"; then
            echo "::error::$APK carries no signature, so no device can install it." \
              "Set ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and" \
              "ANDROID_KEY_PASSWORD, then tag again."
            exit 1
          fi

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: out/*.apk

  ios:
    name: iOS
    needs: version
    if: needs.version.outputs.has_ios_key == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      # Cypress ships a browser binary that `npm ci` downloads from its own
      # CDN. A release build runs no tests and never uses it, and on 2026-09-17
      # that download failed and took the Android build with it.
      - run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      # Two ways to sign. With only the App Store Connect key, `tauri ios
      # build` imports a placeholder identity and lets Xcode sign in the
      # cloud, which works when the key has the Admin role. With an "Apple
      # Distribution" certificate and an App Store provisioning profile in the
      # IOS_* secrets, Tauri imports those and signs locally instead. Either
      # way Tauri does the keychain work itself; the variables are exported
      # here only when they carry a value, for the same reason as the desktop
      # job above. (APPLE_CERTIFICATE is deliberately not used: it is the
      # macOS "Developer ID Application" identity, which cannot sign iOS.)
      - name: Export the iOS signing secrets (when they are set)
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          for name in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION; do
            value="${!name}"
            [ -n "$value" ] || continue
            printf '%s<<IOS_SECRET_EOF\n%s\nIOS_SECRET_EOF\n' \
              "$name" "$value" >> "$GITHUB_ENV"
          done
          if [ -n "$IOS_CERTIFICATE" ]; then
            echo "Signing with the IOS_CERTIFICATE identity."
          else
            echo "No IOS_CERTIFICATE set; Xcode will sign in the cloud with the App Store Connect key."
          fi

      # `tauri ios build` wants a path to the App Store Connect key, and a
      # fresh runner has no such file, so write the key out and hand over
      # where it landed. RUNNER_TEMP is wiped when the job ends.
      - name: Write the App Store Connect key to disk
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$KEY"
          chmod 600 "$KEY"
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Generate the iOS project
        run: npm run tauri -- ios init --ci

      # `ios init` ships Tauri's default icon; put ours in.
      - name: Copy the app icons into the iOS project
        run: npm run icons:mobile

      # xcodebuild's export errors are terse, so the two that come from the
      # Apple account rather than from this repository get a translation.
      - name: Build the IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -o pipefail
          if npm run tauri -- ios build --export-method app-store-connect 2>&1 | tee "$RUNNER_TEMP/ios-build.log"; then
            exit 0
          fi
          if grep -q "Cloud signing permission error" "$RUNNER_TEMP/ios-build.log"; then
            echo "::error::Xcode could not sign in the cloud: the App Store Connect key" \
              "(APPLE_API_KEY) needs the Admin role. Create a new key with Admin access" \
              "under App Store Connect > Users and Access > Integrations, update" \
              "APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_P8, then tag again." \
              "Alternatively sign locally by setting IOS_CERTIFICATE," \
              "IOS_CERTIFICATE_PASSWORD and IOS_MOBILE_PROVISION."
          fi
          if grep -q "No profiles for" "$RUNNER_TEMP/ios-build.log"; then
            echo "::error::No App Store provisioning profile exists for the bundle" \
              "identifier. Register it under developer.apple.com > Identifiers so" \
              "Xcode can create one, or provide a profile in IOS_MOBILE_PROVISION."
          fi
          exit 1

      - name: Rename the IPA
        run: |
          mkdir -p out
          cp src-tauri/gen/apple/build/arm64/*.ipa "out/Synesis_${VERSION}_ios.ipa"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: out/*.ipa
