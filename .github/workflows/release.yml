# Builds installers for every platform when a version tag is pushed
# (`git tag v0.2.0 && git push --tags`, or `npm run release -- 0.2.0`) and
# attaches them to a GitHub Release named after the tag.
#
#   macOS   .dmg / .app  (Apple Silicon and Intel)
#   Windows .msi / .exe
#   Linux   .AppImage / .deb / .rpm
#   Android .apk (unsigned unless ANDROID_* secrets are set)
#   iOS     .ipa, only when the APPLE_* secrets are set (device builds need a
#           signing identity; without one the job is skipped, not failed)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Tag matches the app version
    runs-on: ubuntu-22.04
    outputs:
      has_apple: ${{ steps.secrets.outputs.has_apple }}
      has_android_key: ${{ steps.secrets.outputs.has_android_key }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with package.json, tauri.conf.json and Cargo.toml
        run: node scripts/release.mjs --check "${GITHUB_REF_NAME#v}"
      - id: secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "has_apple=$([ -n "$APPLE_CERTIFICATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_android_key=$([ -n "$ANDROID_KEYSTORE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci --no-audit --no-fund

      # Optional code signing; builds stay unsigned when the secrets are absent.
      # The bundler signs whenever APPLE_CERTIFICATE exists in the environment,
      # and a workflow `env:` entry for a missing secret still exists — it is
      # just empty — so the variables are exported here instead, only once we
      # know they carry a value. Otherwise `security import` is handed an empty
      # certificate and the macOS jobs fail.
      - name: Export the Apple signing secrets (when they are set)
        if: runner.os == 'macOS' && needs.version.outputs.has_apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            # Heredoc form: a base64 certificate may span several lines.
            printf '%s<<APPLE_SECRET_EOF\n%s\nAPPLE_SECRET_EOF\n' \
              "$name" "$value" >> "$GITHUB_ENV"
          done

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Synesis ${{ github.ref_name }}"
          releaseBody: "Installers for macOS, Windows, Linux and Android. See the assets below."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  android:
    name: Android
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci --no-audit --no-fund

      - name: Generate the Android project
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npm run tauri -- android init --ci

      - name: Build the APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npm run tauri -- android build --apk --target aarch64 --target armv7 --target x86_64

      - name: Sign the APK (when ANDROID_* secrets are set)
        if: needs.version.outputs.has_android_key == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/release.keystore
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" -p 4 "$APK" /tmp/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign --ks /tmp/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$APK" /tmp/aligned.apk

      - name: Rename the APK
        run: |
          mkdir -p out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk "out/Synesis_${GITHUB_REF_NAME#v}_android.apk"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.apk

  ios:
    name: iOS
    needs: version
    if: needs.version.outputs.has_apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci --no-audit --no-fund

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain

      - name: Generate the iOS project
        run: npm run tauri -- ios init --ci

      - name: Build the IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: npm run tauri -- ios build --export-method app-store-connect

      - name: Rename the IPA
        run: |
          mkdir -p out
          cp src-tauri/gen/apple/build/arm64/*.ipa "out/Synesis_${GITHUB_REF_NAME#v}_ios.ipa"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: out/*.ipa
